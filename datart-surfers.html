const T=d=>1/(1+d/260);
function P(d,l,h){const t=T(d),u=LW*t;return{x:W/2+l*u,y:HY+(GY-HY)*t-(h||0)*u,u,t}}
function reset(){lane=1;lx=0;jy=0;vy=0;speed=516;dist=0;coins=0;wm=0;fr=0;crash=null;bt=0;slip=0;lvl=0;lvT=0;cycAt=400+Math.random()*300;objs=[];nextD=600;st='play'}
function spawn(){
  if(dist>1200&&Math.random()<.22){objs.push({d:2600,l:0,type:'bridge'});nextD=560+speed*.5+Math.random()*250;return}
  const free=Math.floor(Math.random()*3),d=2600;
  for(let l=0;l<3;l++){
    if(l===free){ if(Math.random()<.7) for(let i=0;i<5;i++) objs.push({d:d+i*110,l:l-1,type:'coin',y:.35,k:Math.random()<.5?0:1}); continue}
    if(Math.random()<.65){const r=Math.random();objs.push({d,l:l-1,type:r<.34?'bin':r<.62?'bar':r<.7?'ice':'box'})}
  }
  if(Math.random()<.14)objs.push({d:d+280,l:Math.floor(Math.random()*3)-1,type:'cash'});
  nextD=520+speed*.5+Math.random()*250;
}
function go(dir){
  if(st!=='play'){ if(st==='menu'||performance.now()>over0+500) reset(); return}
  if(dir==='l')lane=Math.max(0,lane-1);
  if(dir==='r')lane=Math.min(2,lane+1);
  if(dir==='u'&&jy<=0.001){vy=4;duck=0}
  if(dir==='d'){if(jy>.001)vy=-7;else duck=.8}
}
let over0=0;

    vx:(c-1.5)*.35+(Math.random()-.5)*.5,vy:-.3-Math.random()*1.3,vr:(Math.random()-.5)*6,gy:.05+Math.random()*.9,row:r,delay:Math.random()*.2});
  for(let i=0;i<30;i++)sparks.push({x:W/2+lx*LW+(Math.random()-.5)*LW*.6,y:GY-LW*(.3+Math.random()*.5),vx:(Math.random()-.5)*400,vy:-Math.random()*300,life:.3+Math.random()*.4})}

  const k=e.key;

});
const HT={bin:.45,bar:.3,box:9,cyc:9};
function update(dt){
  const target=lane-1;lx+=(target-lx)*Math.min(1,dt*(slip>0?5:14));tilt=(target-lx)*.25;
  if(slip>0){slip-=dt;tilt+=slipDir*.7*Math.sin(Math.max(0,slip)/.6*Math.PI*2)}
  for(const q of sparks){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=700*dt;q.life-=dt}
  sparks=sparks.filter(q=>q.life>0);
  if(crash)for(const q of crash){if(q.delay>0){q.delay-=dt;q.py+=.25*dt;continue}
    q.vy+=7*dt;q.px+=q.vx*dt;q.py+=q.vy*dt;q.r+=q.vr*dt;
    if(q.py>q.gy){q.py=q.gy;if(Math.abs(q.vy)>.3)q.vy*=-.35;else q.vy=0;const f=Math.max(0,1-3*dt);q.vx*=f;q.vr*=f}}
  dk+=((duck>0?1:0)-dk)*Math.min(1,dt*18);

  if(duck>0)duck-=dt;
  const lv=Math.floor(dist/10000);if(lv>lvl){lvl=lv;lvT=2}if(lvT>0)lvT-=dt;

  if(bt>0)bt-=dt;const mv=speed*(bt>0?1.6:1)*dt;dist+=mv;nextD-=mv;
  const sc=Math.floor(dist/10);if(sc>=cycAt){objs=objs.filter(q=>q.d<2150);objs.push({d:2600,l:Math.floor(Math.random()*3)-1,type:'cyc',ph:Math.random()*6});nextD=Math.max(nextD,560);cycAt=sc+400+Math.random()*300}
  if(nextD<=0)spawn();
  if(jy>0||vy>0){jy+=vy*dt;vy-=11*dt;if(jy<=0){jy=0;vy=0}}
  for(const o of objs){
    o.d-=mv;
    if(o.gone)continue;
    if(o.type==='bridge'){
      if(o.d<160&&o.d>-160&&duck>0&&jy<.02)for(let i=0;i<4;i++){const a=Math.random()<.5?-1:1;
        sparks.push({x:W/2+lx*LW+a*LW*.2*Math.random(),y:GY-LW*.1,vx:(Math.random()-.5)*260,vy:-60-Math.random()*260,life:.25+Math.random()*.3})}
      if(Math.abs(o.d)<50&&!(duck>0&&jy<.02)&&bt<=0)die(true);
      continue}
    if(Math.abs(o.d)<45&&Math.abs(o.l-lx)<.55){
      if(o.type==='coin'){if(jy<.6){o.gone=true;coins++;if(o.k)fr++;else wm++}}
      else if(o.type==='cash'){if(jy<.7){o.gone=true;bt=4}}
      else if(o.type==='ice'){if(!o.hit&&bt<=0&&jy<.15){o.hit=true;const dir=lane===0?1:lane===2?-1:(Math.random()<.5?-1:1);lane+=dir;slip=.6;slipDir=dir;duck=0;
        for(let i=0;i<16;i++)sparks.push({x:W/2+lx*LW+(Math.random()-.5)*LW*.5,y:GY-LW*.1,vx:(Math.random()-.5)*300,vy:-Math.random()*220,life:.3+Math.random()*.3,c:'#bfefff'})}}
      else if(bt<=0&&jy<HT[o.type])die();
    }
  }
  objs=objs.filter(o=>o.d>-150&&!o.gone);
}

function drawCoin(p,o){

  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,p.y,.14*u,.03*u,0,0,7);g.fill();
  g.lineWidth=Math.max(1,.02*u);g.strokeStyle='#5a6a7a';
  if(!o.k){const w=.3*u;g.fillStyle='#f4f7fa';g.fillRect(x-w/2,b-w,w,w);g.strokeRect(x-w/2,b-w,w,w);
    g.fillStyle='#c5d0db';g.fillRect(x-w/2,b-w,w,w*.2);g.fillStyle='#3a86c8';g.fillRect(x-w*.4,b-w*.9,w*.15,w*.08);
    g.fillStyle='#7fb8e8';g.beginPath();g.arc(x,b-w*.45,w*.3,0,7);g.fill();g.stroke()}
  else{const w=.22*u,h=.46*u;g.fillStyle='#e8f1f8';g.fillRect(x-w/2,b-h,w,h);g.strokeRect(x-w/2,b-h,w,h);
    g.beginPath();g.moveTo(x-w/2,b-h*.65);g.lineTo(x+w/2,b-h*.65);g.stroke();
    g.fillStyle='#5a6a7a';g.fillRect(x+w*.22,b-h*.92,w*.08,h*.18);g.fillRect(x+w*.22,b-h*.58,w*.08,h*.25)}}
function drawVan(x,y,u,jh){

  g.fillStyle='#0b0f14';g.fillRect(-w*.46,-wl*1.1,.14*u,wl*1.1);g.fillRect(w*.46-.14*u,-wl*1.1,.14*u,wl*1.1);

  if(crash){g.fillStyle='#26364a';g.fillRect(-w*.42,-wl-h*.62,w*.84,h*.62-.02*u);
    g.fillStyle='#8fb3d1';g.fillRect(-w*.32,-wl-h*.56,w*.64,h*.26);g.fillStyle='#1b2533';g.fillRect(-w*.42,-wl-h*.62,w*.84,.04*u);
    g.fillStyle='#e63946';g.fillRect(-w*.4,-wl-h*.2,.05*u,.05*u);g.fillRect(w*.4-.05*u,-wl-h*.2,.05*u,.05*u)}else{
  g.fillStyle='#ffc20e';g.fillRect(-w/2,-wl-h,w,h*.62);

  const ly=-wl-h*.73,ts=.085*u;g.fillStyle='#14204f';
  g.beginPath();g.moveTo(-w*.46,ly-ts*.5);g.lineTo(-w*.46,ly+ts*.5);g.lineTo(-w*.36,ly);g.fill();

function draw(){
  const sk=g.createLinearGradient(0,0,0,HY);sk.addColorStop(0,'#3a6ea5');sk.addColorStop(1,'#f6c58b');
  g.fillStyle=sk;g.fillRect(0,0,W,H);
  g.save();if(shake>0){g.translate((Math.random()-.5)*14*shake,(Math.random()-.5)*14*shake)}
  g.fillStyle='#8b9a7a';g.fillRect(0,HY,W,H);
  const tb=(H-HY)/(GY-HY);
  g.fillStyle='#4a4f57';g.beginPath();g.moveTo(W/2,HY);g.lineTo(W/2+RW*tb,H);g.lineTo(W/2-RW*tb,H);g.fill();
  const cols=['#e9e2d0','#c9d3de','#d8b9a0','#a9b8c6','#e1d3a8'],step=320,off=dist%step,base=Math.floor(dist/step);
  for(let k=14;k>=0;k--){
    const d=k*step-off,i=base+k;
    for(const s of[-1,1]){
      const hh=(2.2+((i*7+(s>0?3:0))%5)*.55),p=P(d,s*2.6,0),w=2.2*p.u,h=hh*p.u,ci=(i*3+(s>0?1:0))%5;
      const x=s<0?p.x-w/2:p.x-w/2;
      g.fillStyle=cols[ci];g.fillRect(x,p.y-h,w,h);g.fillStyle='#2b3440';g.fillRect(x,p.y-h,w,h*.1);
      g.fillStyle='#6b7f96';
      for(let r=0;r<3;r++)for(let q=0;q<3;q++)g.fillRect(x+w*(.12+q*.3),p.y-h*(.8-r*.25),w*.18,h*.12);
    }
  }
  g.strokeStyle='rgba(255,255,255,.75)';
  for(let k=0;k<12;k++){
    const d0=k*240-(dist%240),d1=d0+110;if(d1<0)continue;
    const a=P(Math.max(d0,0),0,0),b=P(d1,0,0);
    for(const l of[-.5,.5]){const A=P(Math.max(d0,0),l,0),B=P(d1,l,0);
      g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.moveTo(A.x-2*A.t,A.y);g.lineTo(A.x+2*A.t,A.y);g.lineTo(B.x+2*B.t,B.y);g.lineTo(B.x-2*B.t,B.y);g.fill()}
  }
  g.fillStyle='#ffc20e';for(const s of[-1,1]){const A=P(0,s*1.5,0),B=P(2600,s*1.5,0);
    g.beginPath();g.moveTo(A.x-4,GY+(H-GY));g.lineTo(A.x+4,H);g.lineTo(B.x+1,B.y);g.lineTo(B.x-1,B.y);g.fill()}
  if(bt>0&&st==='play'){g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;const tt=performance.now()/250;
    for(let i=0;i<18;i++){const a=Math.PI*(.04+.92*i/17),r=(.25+((tt+i*.37)%1)*.9)*W;
      g.beginPath();g.moveTo(W/2+Math.cos(a)*r*.75,HY+Math.sin(a)*r*.6);g.lineTo(W/2+Math.cos(a)*r,HY+Math.sin(a)*r*.8);g.stroke()}}
  const sorted=objs.slice().sort((a,b)=>b.d-a.d);
  for(const o of sorted)if(o.d>=0)dr(o);
  if(st!=='over'||performance.now()-over0<2000||true)drawVan(W/2+lx*LW,GY,LW,jy);
  if(bt>0&&st==='play'){const fx=W/2+lx*LW,fy=GY-jy*LW;for(const sd of[-1,1]){const fl=.7+Math.random()*.5;
    g.fillStyle='#ff7a1a';g.beginPath();g.moveTo(fx+sd*.16*LW-.06*LW,fy-.1*LW);g.lineTo(fx+sd*.16*LW+.06*LW,fy-.1*LW);g.lineTo(fx+sd*.16*LW,fy+.3*LW*fl);g.fill();
    g.fillStyle='#ffe066';g.beginPath();g.moveTo(fx+sd*.16*LW-.03*LW,fy-.1*LW);g.lineTo(fx+sd*.16*LW+.03*LW,fy-.1*LW);g.lineTo(fx+sd*.16*LW,fy+.16*LW*fl);g.fill()}}
  for(const o of sorted)if(o.d<0)dr(o);
  if(crash)for(const q of crash){const s2=1+q.py*.15;g.save();g.translate(W/2+lx*LW+q.px*LW,GY+q.py*LW);g.rotate(q.r);
    g.fillStyle=q.row===2?'#1b3a8c':'#ffc20e';g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=1.5;
    g.fillRect(-q.pw*LW*s2/2,-q.ph*LW*s2/2,q.pw*LW*s2,q.ph*LW*s2);g.strokeRect(-q.pw*LW*s2/2,-q.ph*LW*s2/2,q.pw*LW*s2,q.ph*LW*s2);g.restore()}
  for(const q of sparks){g.strokeStyle=q.c||(q.life>.25?'#fff3a0':'#ff9a1f');g.lineWidth=2;g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x-q.vx*.03,q.y-q.vy*.03);g.stroke()}
  g.restore();
  hud();
}
function dr(o){
  const p=P(o.d,o.l,0);
  if(o.type==='ice')drawIce(p,o);else if(o.type==='cash')drawCash(p,o);else if(o.type==='cyc')drawCyc(p,o);else if(o.type==='bridge')drawBridge(p);else if(o.type==='coin')drawCoin(p,o);else if(o.type==='bin')drawBin(p,'#2b7fd6');else if(o.type==='bar')drawBar(p);else drawBox(p)}
function txt(s,x,y,sz,col,al){g.font='bold '+sz+'px "Trebuchet MS",Verdana,sans-serif';g.textAlign=al||'center';g.textBaseline='middle';
  g.lineWidth=sz*.18;g.strokeStyle='#0d1b3a';g.strokeText(s,x,y);g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function hud(){
  const s=Math.floor(dist/10),m=Math.max(14,Math.min(W,H)*.045),pad=14;
  txt(String(s),pad,pad+m*.6,m*1.3,'#fff','left');

  txt('lednice '+fr,W-pad,pad+m*1.9,m*1,'#9fd8ff','right');
  txt('rekord '+best,pad,pad+m*2,m*.8,'#d4e3ff','left');
  txt('level '+(lvl+1),pad,pad+m*3.2,m*.8,'#ffc20e','left');
  if(st==='play'&&lvT>0&&Math.floor(performance.now()/200)%2)txt('LEVEL '+(lvl+1),W/2,H*.24,Math.min(W*.09,54),'#ffc20e');
  if(st==='play'&&bt>0){const bw=W*.4,bx=W/2-bw/2,by=pad+m*3.2;g.fillStyle='rgba(0,0,0,.4)';g.fillRect(bx,by,bw,m*.5);g.fillStyle='#3ddc84';g.fillRect(bx,by,bw*bt/4,m*.5);txt('BOOST',W/2,by-m*.6,m*.9,'#7dff9b')}
  if(st==='menu'||st==='over'){

    txt(st==='menu'?'Klepni nebo stiskni mezerník':'Klepni a jeď znovu',W/2,H*.58,q*1.1,'#fff');
    txt('← → nebo přejeď prstem do stran: změna pruhu',W/2,H*.58+q*2.2,q*.8,'#d4e3ff');
    txt('↑ / mezerník / přejeď nahoru: skok přes koše a zábrany',W/2,H*.58+q*3.4,q*.8,'#d4e3ff');
    txt('↓ / S / přejeď dolů: sníž se pod mostem (jiskry!)',W/2,H*.58+q*4.6,q*.8,'#d4e3ff');
    txt('Kontejnery objeď, přeskočit nejdou.',W/2,H*.58+q*5.8,q*.8,'#d4e3ff');
    txt('Ledová kaluž tě smýkne do boku (přeskoč ji)',W/2,H*.58+q*8.2,q*.8,'#bfefff');
    txt('Bankovka = boost: rychlost a nesmrtelnost na pár vteřin',W/2,H*.58+q*7,q*.8,'#7dff9b');
  }
}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(shake>0)shake=Math.max(0,shake-dt);update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
